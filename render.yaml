services:
  - type: web
    name: campmeeting
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: campmeeting-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
